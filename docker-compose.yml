services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    # Bound to localhost only: the API reaches Postgres over the compose
    # network, so the port stays off the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # S3 API (9000) stays on localhost; only the web console (9001) is public.
    ports:
      - "127.0.0.1:9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/aletheia-images
        exit 0

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aletheia:aletheia@postgres:5432/aletheia?sslmode=disable
      RPC_URL: http://anvil:8545
      FROM_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      SERVER_PORT: "8080"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aletheia-images
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:

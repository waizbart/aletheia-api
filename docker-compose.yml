services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    # Bound to localhost only: the API reaches Postgres over the compose
    # network, so the port stays off the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"            # Jaeger UI
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aletheia:aletheia@postgres:5432/aletheia?sslmode=disable
      RPC_URL: http://anvil:8545
      FROM_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      SERVER_PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_SERVICE_NAME: aletheia-api
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  pgdata:

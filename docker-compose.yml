services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    # Bound to localhost only: the API reaches Postgres over the compose
    # network, so the port stays off the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"            # Jaeger UI
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aletheia:aletheia@postgres:5432/aletheia?sslmode=disable
      SERVER_PORT: "8080"

      # Admin token guarding tenant onboarding, certificate deletion and the
      # observability dashboard. This value is for local development only.
      ADMIN_API_TOKEN: local-dev-admin-token

      # Anchoring. The key below is Anvil's first development account, which is
      # pre-funded on the local node and published in Foundry's documentation —
      # never use it anywhere else.
      RPC_URL: http://anvil:8545
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      ANCHOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      CHAIN_ID: "31337"
      ANCHOR_INTERVAL: 1m

      # Attested capture is intentionally left unconfigured.
      #
      # The Google hardware attestation roots are not in the repository — they
      # rotate, and a stale committed bundle is worse than none. With all three
      # variables unset the API starts and verifies normally, and device
      # enrolment answers 501 unsupported, which is the truth.
      #
      # To exercise enrolment locally, drop the roots bundle at
      # config/android-attestation-roots.pem (see config/README.md) and
      # uncomment all three:
      #
      # ANDROID_ATTESTATION_ROOTS: /config/android-attestation-roots.pem
      # ANDROID_ALLOWED_PACKAGES: com.aletheia.camera
      # ANDROID_SIGNATURE_DIGESTS: "<sha256 of your APK signing certificate>"

      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_SERVICE_NAME: aletheia-api
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  pgdata:

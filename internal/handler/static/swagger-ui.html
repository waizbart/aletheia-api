<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Aletheia API — certificação de mídia ancorada em blockchain." />
  <meta name="color-scheme" content="light dark" />
  <title>Aletheia API · Docs</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M16 44 L32 16 L48 44 H38 L32 32 L26 44 Z' fill='%2360a5fa'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />

  <style>
    :root {
      color-scheme: light dark;
      --brand-bg: #0f172a;
      --brand-fg: #f8fafc;
      --brand-accent: #60a5fa;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    header.brand {
      background: var(--brand-bg);
      color: var(--brand-fg);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid var(--brand-accent);
    }

    header.brand .mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--brand-accent);
      display: grid;
      place-items: center;
      color: var(--brand-bg);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    header.brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    header.brand .meta {
      margin-left: auto;
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
      opacity: 0.85;
    }

    header.brand a {
      color: var(--brand-accent);
      text-decoration: none;
    }

    header.brand a:hover {
      text-decoration: underline;
    }

    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    #swagger-ui .topbar { display: none; }

    #swagger-ui .information-container.wrapper { padding: 24px 0 8px; }

    .swagger-ui .scheme-container {
      box-shadow: none;
      border-bottom: 1px solid #e5e7eb;
      background: transparent;
      padding: 12px 0;
    }

    .swagger-ui .opblock-tag {
      border-bottom: 1px solid #e5e7eb;
    }

    .swagger-ui .opblock .opblock-summary-method {
      min-width: 80px;
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #0b1220; }
      #swagger-ui, .swagger-ui { color: #e5e7eb; }
    }

    .loading {
      display: grid;
      place-items: center;
      padding: 64px 16px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="mark">A</div>
    <h1>Aletheia API · Documentation</h1>
    <nav class="meta">
      <a href="/docs/openapi.yaml" target="_blank" rel="noopener">openapi.yaml</a>
      <a href="https://github.com/waizbart/aletheia-api" target="_blank" rel="noopener">GitHub</a>
      <a href="/health" target="_blank" rel="noopener">/health</a>
    </nav>
  </header>

  <div id="swagger-ui">
    <div class="loading">Carregando documentação…</div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>

  <script>
    window.addEventListener("load", function () {
      const ui = SwaggerUIBundle({
        url: "/docs/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        docExpansion: "list",
        filter: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
        syntaxHighlight: {
          activate: true,
          theme: "agate"
        },
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout"
      });

      window.ui = ui;
    });
  </script>
</body>
</html>

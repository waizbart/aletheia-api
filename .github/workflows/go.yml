name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Install OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libopencv-dev

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test ./internal/... ./tests/...

    - name: Verify coverage
      run: bash scripts/check-coverage.sh
